<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="event-card">
    <h1 id="event-title">Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>

    <button id="show-program" type="button">Показать программу</button>
    <p id="program" class="program" hidden></p>

    <p id="data-error" class="error" hidden></p>

    <form id="service-form" class="service-form" hidden>
      <h2>Дополнительные услуги</h2>

      <label class="service-option">
        <input id="guide" type="checkbox">
        Экскурсия с гидом
      </label>

      <label class="service-option">
        <input id="audio" type="checkbox">
        Аудиогид
      </label>

      <label class="service-option">
        <input id="catalog" type="checkbox">
        Каталог выставки
      </label>

      <button type="submit">Рассчитать</button>
    </form>

    <p id="choice-error" class="error" hidden></p>
    <div id="result" class="result" hidden></div>
    <pre id="report-json" class="report-json" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
